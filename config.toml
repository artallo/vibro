[serial]
port = "COM8"
baud = 115200
timeout_seconds = 2.0

[session]
packets_per_session = 8
min_recommended_sessions = 5

[sensor]
odr_hz = 250

[welch]
nperseg = 1024
noverlap = 512

[stable_spectrum]
# Width of the running-median baseline of stable_spectrum.py and
# overview_figure.py. A structure wider than about half of it lifts its own
# baseline; 10 Hz keeps the top of a 3-4 Hz wide hump. Was 5 Hz until
# 2026-10-01.
baseline_window_hz = 10.0
# Peaks of stable_spectrum.py and overview_figure.py closer than this merge;
# its own key, so the old detector keeps min_distance_hz of [[analysis.bands]].
min_distance_hz = 1.0
# A weaker peak within min_distance_hz of a stronger one stays when the dip
# between them is deeper than this many standard errors; 0 merges every
# close pair, as before 2026-10-02.
separation_sigma = 2.0
# Segment lengths stable_spectrum.py analyses when --nperseg is not given.
# 2048 (bin 0.12 Hz) gives the highest z on the building modes found so far;
# list several, e.g. [1024, 2048, 4096], to compare resolutions. Was
# [1024, 2048, 4096] until 2026-10-02.
nperseg = [2048]

[visualization.trusted_frequency]
min_support_fraction = 0.50
min_median_prominence_db = 1.55
background_weight = 0.5
min_band_contrast_db = 1.0
weak_trusted_weight = 0.7

[analysis.frequency_cluster_consolidation]
median_frequency_tolerance_hz = 0.20

[analysis.frequency_clustering]
frequency_tolerance_hz_250 = 0.40
frequency_tolerance_hz_125 = 0.35
frequency_tolerance_hz_62p5 = 0.25

[[analysis.bands]]
name = "Low frequency"
min_frequency = 0.2
max_frequency = 10.0
prominence_db = 1.8
min_distance_hz = 1.0
min_stability = 4.1
frequency_stability_max_std_hz = 0.20
noise_window_hz = 1.5

[[analysis.bands]]
name = "High frequency"
min_frequency = 10.0
max_frequency = 15.0
prominence_db = 1.8
min_distance_hz = 1.0
min_stability = 4.1
frequency_stability_max_std_hz = 0.20
noise_window_hz = 1.5
