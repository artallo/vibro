[serial]
port = "COM8"
baud = 115200
timeout_seconds = 2.0

[session]
packets_per_session = 8
min_recommended_sessions = 5

[sensor]
odr_hz = 250

[welch]
nperseg = 1024
noverlap = 512

[visualization.trusted_frequency]
min_support_fraction = 0.50
min_median_prominence_db = 1.55
background_weight = 0.5
min_band_contrast_db = 1.0
weak_trusted_weight = 0.7

[analysis.frequency_cluster_consolidation]
median_frequency_tolerance_hz = 0.20

[[analysis.bands]]
name = "Low frequency"
min_frequency = 0.5
max_frequency = 10.0
prominence_db = 1.8
min_distance_hz = 1.0
min_stability = 4.1
frequency_tolerance_hz = 0.35
frequency_stability_max_std_hz = 0.20
noise_window_hz = 1.5

[[analysis.bands]]
name = "High frequency"
min_frequency = 10.0
max_frequency = 15.0
prominence_db = 1.8
min_distance_hz = 1.0
min_stability = 4.1
frequency_tolerance_hz = 0.35
frequency_stability_max_std_hz = 0.20
noise_window_hz = 1.5
