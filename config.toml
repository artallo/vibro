[serial]
port = "COM8"
baud = 115200
timeout_seconds = 2.0

[session]
packets_per_session = 8
min_recommended_sessions = 5

[sensor]
odr_hz = 250

[welch]
nperseg = 1024
noverlap = 512

[visualization.repeatability_weighting]
min_weight = 0.2

[[analysis.bands]]
name = "Low frequency"
min_frequency = 0.5
max_frequency = 10.0
prominence_db = 1.8
min_distance_hz = 1.0
min_stability = 4.5
frequency_tolerance_hz = 0.25
noise_window_hz = 1.0

[[analysis.bands]]
name = "High frequency"
min_frequency = 10.0
max_frequency = 15.0
prominence_db = 1.8
min_distance_hz = 1.0
min_stability = 4.5
frequency_tolerance_hz = 0.25
noise_window_hz = 2.0
