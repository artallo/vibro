[serial]
port = "COM8"
baud = 115200
timeout_seconds = 2.0

[session]
packets_per_session = 8
# 8 x 32 = 256 packets, about 17 minutes: the whole-record layout that is
# calibrated in every old detector mode. Was 5 until 2026-10-03.
min_recommended_sessions = 32

[sensor]
odr_hz = 250

[welch]
# Old detector mode of main.py: picks [old_detector.nperseg_<n>] below, where
# noverlap and the calibrated layouts live; main.py --nperseg overrides it for
# one run. 1024 until 2026-10-03. stable_spectrum.py has its own nperseg.
nperseg = 2048

# Old detector modes. Replay builds only the layouts listed for the mode, and
# a live run must use one of them: each has its own Med.Prom threshold for a
# trusted region. A shorter run has a noisier median PSD and needs more.
[old_detector.nperseg_1024]
noverlap = 512

# The mode as it was until 2026-10-03: one threshold for every layout.
[old_detector.nperseg_1024.min_median_prominence_db_by_layout]
"4x4" = 1.55
"4x8" = 1.55
"4x16" = 1.55
"4x32" = 1.55
"4x64" = 1.55
"8x4" = 1.55
"8x8" = 1.55
"8x16" = 1.55
"8x32" = 1.55

[old_detector.nperseg_2048]
noverlap = 1024

# Calibrated on 2026-10-03: 0.05 dB above the highest Med.Prom on 10 white and
# 10 coloured synthetic noise captures, which then gave no trusted region; all
# trusted frequencies of the control points at 8x32 stay at 8x32.
[old_detector.nperseg_2048.min_median_prominence_db_by_layout]
"8x32" = 2.0
"8x16" = 2.95
"8x8" = 4.25
"16x16" = 1.96
"16x8" = 2.94

[stable_spectrum]
# Width of the running-median baseline of stable_spectrum.py and
# overview_figure.py. A structure wider than about half of it lifts its own
# baseline; 10 Hz keeps the top of a 3-4 Hz wide hump. Was 5 Hz until
# 2026-10-01.
baseline_window_hz = 10.0
# Peaks of stable_spectrum.py and overview_figure.py closer than this merge;
# its own key, so the old detector keeps min_distance_hz of [[analysis.bands]].
min_distance_hz = 1.0
# A weaker peak within min_distance_hz of a stronger one stays when the dip
# between them is deeper than this many standard errors; 0 merges every
# close pair, as before 2026-10-02.
separation_sigma = 2.0
# Segment lengths stable_spectrum.py analyses when --nperseg is not given.
# 2048 (bin 0.12 Hz) gives the highest z on the building modes found so far;
# list several, e.g. [1024, 2048, 4096], to compare resolutions. Was
# [1024, 2048, 4096] until 2026-10-02.
nperseg = [2048]

[visualization.trusted_frequency]
min_support_fraction = 0.50
# The Med.Prom threshold is set per layout in [old_detector.nperseg_<n>].
background_weight = 0.7
min_band_contrast_db = 1.0
weak_trusted_weight = 0.8

[analysis.frequency_cluster_consolidation]
median_frequency_tolerance_hz = 0.20
# How many sessions two clusters of one band may share and still merge into
# one region. 0: their sessions must not overlap, the rule until 2026-10-04;
# 1 since then: one stray session no longer splits a region.
max_shared_sessions = 1

[analysis.frequency_clustering]
frequency_tolerance_hz_250 = 0.40
frequency_tolerance_hz_125 = 0.35
frequency_tolerance_hz_62p5 = 0.25

[[analysis.bands]]
name = "Low frequency"
min_frequency = 0.2
max_frequency = 10.0
prominence_db = 1.8
min_distance_hz = 1.0
min_stability = 4.1
frequency_stability_max_std_hz = 0.20
noise_window_hz = 1.5

[[analysis.bands]]
name = "High frequency"
min_frequency = 10.0
max_frequency = 15.0
prominence_db = 1.8
min_distance_hz = 1.0
min_stability = 4.1
frequency_stability_max_std_hz = 0.20
noise_window_hz = 1.5
